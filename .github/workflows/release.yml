name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to create or update. Must match manifest.json version."
                required: true
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build release assets
              run: npm run build

            - name: Validate release tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
                  RELEASE_TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
                  if [ "$RELEASE_TAG" != "$MANIFEST_VERSION" ]; then
                      echo "Release tag '$RELEASE_TAG' must match manifest.json version '$MANIFEST_VERSION'."
                      exit 1
                  fi
                  TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
                  HEAD_SHA="$(git rev-parse HEAD)"
                  if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
                      echo "Release tag '$RELEASE_TAG' points at $TAG_SHA, but this workflow built $HEAD_SHA."
                      exit 1
                  fi
                  echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

            - name: Generate artifact attestations
              uses: actions/attest@v4
              with:
                  subject-path: |
                      ${{ github.workspace }}/manifest.json
                      ${{ github.workspace }}/main.js
                      ${{ github.workspace }}/styles.css

            - name: Publish release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
                  gh release upload "$RELEASE_TAG" manifest.json main.js styles.css --clobber
